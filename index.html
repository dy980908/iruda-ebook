<script type="text/javascript">

function loadApp() {

	$('.flipbook').turn({
		width:922,
		height:600,
		elevation: 50,
		gradients: true,
		autoCenter: true
	});

	// 👉 페이지 변경 감지
	$('.flipbook').bind('turned', function(e, page) {

		if(page === 1){
			$('h5').removeClass('hide');
		}else{
			$('h5').addClass('hide');
		}

	});
}

// turn.js 로드 후 실행 (한 번만!)
yepnope({
	test : Modernizr.csstransforms,
	yep: ['./lib/turn.js'],
	nope: ['./lib/turn.html4.min.js'],
	both: ['./css/basic.css'],
	complete: loadApp
});

</script>
