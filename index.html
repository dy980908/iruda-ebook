<script type="text/javascript" src="./js/basic.js"></script>

<script type="text/javascript">
yepnope({
	test: Modernizr.csstransforms,
	yep: ['./lib/turn.js'],
	nope: ['./lib/turn.html4.min.js'],
	both: ['./css/basic.css'],

	complete: function () {

		/* 기존 플립북 실행 */
		loadApp();

		var BOOK_WIDTH = 922;
		var BOOK_HEIGHT = 600;

		function resizeBook() {

			var windowWidth = window.innerWidth;
			var windowHeight = window.innerHeight;

			/* 화면 가장자리 여백 */
			var sidePadding = 24;
			var topBottomPadding = 150;

			/* 가로 기준 축소 비율 */
			var widthScale =
				(windowWidth - sidePadding) / BOOK_WIDTH;

			/* 세로 기준 축소 비율 */
			var heightScale =
				(windowHeight - topBottomPadding) / BOOK_HEIGHT;

			/* 가로와 세로 중 더 작은 값 적용 */
			var scale = Math.min(
				widthScale,
				heightScale,
				1
			);

			/* 지나치게 작아지는 것 방지 */
			if (scale < 0.25) {
				scale = 0.25;
			}

			var $container =
				$('.flipbook-viewport .container');

			$container.css({
				transform: 'scale(' + scale + ')',
				'-webkit-transform': 'scale(' + scale + ')'
			});

			/*
			 * 실제 축소된 책 높이
			 */
			var scaledBookHeight = BOOK_HEIGHT * scale;

			/*
			 * 책의 화면상 중심 위치
			 */
			var bookCenterY = windowHeight * 0.56;

			/*
			 * 책 상단 위치
			 */
			var bookTop =
				bookCenterY - scaledBookHeight / 2;

			/*
			 * 안내문을 책 바로 위에 배치
			 */
			var guideGap = Math.max(
				18,
				scaledBookHeight * 0.08
			);

			var guideTop =
				bookTop - guideGap - 25;

			if (guideTop < 15) {
				guideTop = 15;
			}

			$('h5').css('top', guideTop + 'px');
		}

		/* 최초 실행 */
		resizeBook();

		/* 창 크기 변경 */
		$(window).bind(
			'resize orientationchange',
			function () {
				resizeBook();
			}
		);

		/* 키보드 방향키 페이지 이동 */
		$(document).bind('keydown', function (e) {

			var $flipbook = $('.flipbook');

			if (e.keyCode === 37) {
				e.preventDefault();
				$flipbook.turn('previous');
			}

			if (e.keyCode === 39) {
				e.preventDefault();
				$flipbook.turn('next');
			}
		});
	}
});
</script>

</body>

</html>
